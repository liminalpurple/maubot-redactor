[project]
name = "maubot-redactor"
version = "0.1.0"
description = "A Maubot plugin that automatically redacts messages from users banned for specific reasons."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "Morgan", email = "morgan@cisnt.uk" }]
maintainers = [{ name = "Morgan", email = "morgan@cisnt.uk" }]
dependencies = ["maubot>=0.6.0"]

[project.urls]
"Homepage" = "https://git.cisnt.uk/morgan/maubot-redactor"
"Bug Tracker" = "https://git.cisnt.uk/morgan/maubot-redactor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redactor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
cache_dir = "/tmp/.pytest_cache"
testpaths = "tests"

[tool.ruff]
cache-dir = "/tmp/.ruff_cache"
fix = true
line-length = 100
target-version = "py313"
unsafe-fixes = true

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "B019", "BLE001", "COM812", "CPY001"]

[tool.ruff.lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
]

[tool.uv]
link-mode = "copy"
