name: Build and Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Prepare uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          # The lock targets 3.13; newer runner Pythons have no wheels for some pinned deps
          python-version: "3.13"
          # Later steps run mbc and ruff from the venv, which setup-uv only activates
          # when asked from v6 onwards
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Run tests and build plugin
        run: |
          # Install dependencies into the .venv setup-uv created and activated
          uv sync --active --dev --no-install-project
          # Lint with ruff
          echo "## Ruff Check Issues" >> $GITHUB_STEP_SUMMARY
          ruff check . --output-format=github >> $GITHUB_STEP_SUMMARY
          echo "## Ruff Format Issues" >> $GITHUB_STEP_SUMMARY
          ruff format --check --diff . >> $GITHUB_STEP_SUMMARY
          # Build plugin
          mbc build
          # Store the .mbp filename
          echo "MBP_FILE=$(ls *.mbp)" >> $GITHUB_ENV

      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        env:
          MBP_FILE: ${{ env.MBP_FILE }}
        with:
          compression-level: 0
          if-no-files-found: error
          name: ${{ env.MBP_FILE }}
          path: ${{ env.MBP_FILE }}
